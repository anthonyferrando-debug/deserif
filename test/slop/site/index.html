<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fake feed</title>
<style>
  body { font-family: Helvetica, Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 16px; }
  .post { background: #fff; border-radius: 8px; padding: 12px; margin: 0 auto 16px; width: 500px; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .media { position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 6px; background: #000; }
  .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .comment { margin: 10px 0 0 48px; }
  .comment img.attach { display: block; max-width: 100%; height: auto; border-radius: 8px; }
  .emoji { width: 16px; height: 16px; vertical-align: middle; }
</style>
</head>
<body>
<script>
  // Remember each image's first rendered size so the test can prove a blocked
  // image keeps its box.
  window.__sizes = {};
  document.addEventListener('load', e => {
    const t = e.target;
    if (t.tagName === 'IMG' && t.id && !(t.id in window.__sizes)) {
      const r = t.getBoundingClientRect();
      window.__sizes[t.id] = [Math.round(r.width), Math.round(r.height)];
    }
  }, true);
</script>

<div class="post">
  <div class="head">
    <img id="p_avatar" class="avatar" src="https://scontent.xx.fbcdn.net/v/t39.30808-6/real_headshot.jpg?_nc_cat=1&amp;oh=aa">
    <b>Ramon Walker</b>
    <img id="p_emoji" class="emoji" src="https://static.xx.fbcdn.net/images/emoji.php/v9/t1/1/16/1f600.png">
  </div>
  <p>NEXA bought UMortgage. But what happens to the shares? <img id="p_rsrc" class="emoji" src="https://www.facebook.com/rsrc.php/v3/yx/r/like.png"></p>
  <a href="#photo-opened" id="link_poster"><div class="media">
    <img id="p_poster" src="https://scontent.xx.fbcdn.net/v/t39.30808-6/ai_poster.jpg?_nc_cat=1&amp;oh=bb" alt="May be an image of text that says 'Bridging the Digital Divide'">
  </div></a>
</div>

<div class="post">
  <div class="head"><img class="avatar" src="https://scontent.xx.fbcdn.net/v/t39.30808-6/real_headshot.jpg?_nc_cat=1&amp;oh=aa"><b>Anthony Ferrando</b></div>
  <a href="#photo-opened"><div class="media">
    <img id="p_head" src="https://scontent.xx.fbcdn.net/v/t39.30808-6/real_headshot.jpg?_nc_cat=1&amp;oh=cc">
  </div></a>
  <div class="comment"><img id="p_info" class="attach" src="https://scontent.xx.fbcdn.net/v/t39.30808-6/ai_infographic.jpg?_nc_cat=1&amp;oh=dd" width="400"></div>
  <div class="comment"><img id="p_dup" class="attach" src="https://scontent.xx.fbcdn.net/v/t39.30808-6/ai_infographic.jpg?_nc_cat=1&amp;oh=ee" width="300"></div>
</div>

<div class="post">
  <a href="#photo-opened"><div class="media">
    <img id="p_effect" src="https://scontent.xx.fbcdn.net/v/t39.30808-6/ai_effect.jpg?_nc_cat=1&amp;oh=ff">
  </div></a>
  <div class="comment"><img id="p_shot" class="attach" src="https://scontent.xx.fbcdn.net/v/t39.30808-6/real_screenshot.jpg?_nc_cat=1&amp;oh=gg" width="400"></div>
  <div class="comment"><img id="p_blog" class="attach" src="https://scontent.xx.fbcdn.net/v/t39.30808-6/blog_image.jpg?_nc_cat=1&amp;oh=hh" width="400"></div>
  <div class="comment"><img id="p_recycle" class="attach" src="https://scontent.xx.fbcdn.net/v/t39.30808-6/real_headshot.jpg?_nc_cat=1&amp;oh=ii" width="300"></div>
  <div class="comment" id="lazyHost"></div>
  <div class="comment"><img id="p_offsite" class="attach" src="https://www.facebook.com/local/ai_poster.jpg" width="300"></div>
</div>

<script>
  // A comment image that arrives later, and an element Facebook recycles for a
  // different picture after it was already checked.
  setTimeout(() => {
    const img = document.createElement('img');
    img.id = 'p_lazy'; img.className = 'attach'; img.width = 400;
    img.src = 'https://scontent.xx.fbcdn.net/v/t39.30808-6/ai_diagram.jpg?_nc_cat=1&oh=jj';
    document.getElementById('lazyHost').appendChild(img);
  }, 1500);
  setTimeout(() => {
    document.getElementById('p_recycle').src = 'https://scontent.xx.fbcdn.net/v/t39.30808-6/ai_effect.jpg?_nc_cat=1&oh=kk';
  }, 3000);
</script>
</body>
</html>
